name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  quality:
    name: Lint, Typecheck, Unit/RLS tests, Build, Demo E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e -- --project=chromium --project=webkit --project=mobile-chrome --project=mobile-safari
      # Next.js 15 bundles a PostCSS with known advisories (build time only, see docs/SECURITY.md); fail on critical ones.
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=critical

  backend:
    name: Backend integration (self-hosted Supabase in Docker)
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Docker Hub occasionally times out on shared runners; retry the image pulls before starting the stack.
      - name: Pull images (with retries)
        run: |
          bash scripts/stack.sh secrets
          for attempt in 1 2 3 4; do
            docker compose --env-file docker/stack.secrets -f docker/supabase/compose.yml -f docker/supabase/compose.local.yml pull --ignore-buildable && exit 0
            echo "pull attempt $attempt failed, retrying"; sleep $((attempt * 20))
          done
          exit 1
      - name: Start the Supabase stack and apply migrations
        run: bash scripts/stack.sh up
      - name: Backend tests (RLS, storage, sync, mail against the real stack)
        run: npm run test:backend
      - name: Build and start the app container
        run: bash scripts/stack.sh app-up
      - run: npx playwright install --with-deps chromium webkit
      - name: Browser tests against the full stack
        run: npm run test:e2e:supabase
      - name: Backup and restore drill (isolated project)
        run: bash scripts/verify-restore.sh
      - name: Stack logs on failure
        if: failure()
        run: bash scripts/stack.sh logs
